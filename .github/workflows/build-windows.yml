name: Build NEXORA SYNC Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare application icon
        shell: pwsh
        run: |
          $icon = [Convert]::FromBase64String((Get-Content assets/nexora.ico.base64 -Raw).Trim())
          [System.IO.File]::WriteAllBytes('src/NexoraSync.App/nexora.ico', $icon)
      - name: Restore
        run: dotnet restore src/NexoraSync.App/NexoraSync.App.csproj
      - name: Publish self-contained Windows app
        run: dotnet publish src/NexoraSync.App/NexoraSync.App.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = [xml](Get-Content src/NexoraSync.App/NexoraSync.App.csproj -Raw)
          $appVersion = $version.Project.PropertyGroup.Version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/NexoraSync.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexoraSync-Setup-${{ env.APP_VERSION }}
          path: artifacts/NexoraSync-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30
      - name: Validate release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ env.APP_VERSION }}") {
            throw "Release tag must match application version v$env:APP_VERSION"
          }
      - name: Publish official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NEXORA SYNC ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/NexoraSync-Setup-${{ env.APP_VERSION }}.exe
