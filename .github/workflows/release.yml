name: Publish NEXORA SYNC release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.1.8)"
        required: true
        default: "0.1.8"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must look like v1.2.3" }
          $project = 'src/NexoraSync.App/NexoraSync.App.csproj'
          [xml]$xml = Get-Content $project
          $property = $xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $property.Version = $version
          $xml.Save((Resolve-Path $project))
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare application icon
        shell: pwsh
        run: |
          $icon = [Convert]::FromBase64String((Get-Content assets/nexora.ico.base64 -Raw).Trim())
          [System.IO.File]::WriteAllBytes('src/NexoraSync.App/nexora.ico', $icon)
      - name: Restore
        run: dotnet restore src/NexoraSync.App/NexoraSync.App.csproj
      - name: Publish self-contained Windows app
        run: dotnet publish src/NexoraSync.App/NexoraSync.App.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build versioned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $iss = Get-Content installer/NexoraSync.iss -Raw
          $iss = $iss -replace 'AppVersion=0.1.8', "AppVersion=$env:APP_VERSION"
          $iss = $iss -replace 'OutputBaseFilename=NexoraSync-Setup-0.1.8', "OutputBaseFilename=NexoraSync-Setup-$env:APP_VERSION"
          Set-Content installer/NexoraSync.Release.iss $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/NexoraSync.Release.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEXORA SYNC v${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: artifacts/NexoraSync-Setup-*.exe
